# Nginx como proxy reverso: única porta aberta para fora (8080 no notebook).
# Cada "location" encaminha para um serviço da rede interna do Docker.
server {
    listen 80;
    server_name _;

    # Microsserviço de autenticação
    location /api/user {
        proxy_pass http://auth-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Próximos serviços (leituras do sensor, fotos) entram aqui.
}
