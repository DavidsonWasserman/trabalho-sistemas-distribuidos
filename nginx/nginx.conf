# Nginx como proxy reverso: única porta aberta para fora (8080 no notebook).
# Cada "location" encaminha para um serviço da rede interna do Docker.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Microsserviço de autenticação
    location /api/user {
        proxy_pass http://auth-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/period {
        proxy_pass http://data-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/photos {
        client_max_body_size 10m;
        error_page 413 = @photo_too_large;
        proxy_pass http://data-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /api/photos/ {
        proxy_pass http://data-service:3002;
    }

    location @photo_too_large {
        default_type application/json;
        return 413 '{"error":"O JPEG excede o limite de 10 MiB."}';
    }

    location / {
        return 404;
    }
}
