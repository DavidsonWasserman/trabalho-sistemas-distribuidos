# Nginx como proxy reverso: única porta aberta para fora (8080 no notebook).
limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;

log_format with_upstream '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                         'upstream=$upstream_addr';

upstream auth_backend {
    zone auth_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server auth-service:3001 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log with_upstream;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";

    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~ ^/api/user(?:/?|/(?:login|me|byId/[^/]+)/?)$ {
        limit_req zone=public_api burst=60 nodelay;
        proxy_pass http://auth_backend;
    }

    location = /api/period {
        limit_req zone=public_api burst=60 nodelay;
        proxy_pass http://data-service:3002;
    }

    location = /api/photos {
        limit_req zone=public_api burst=60 nodelay;
        client_max_body_size 10m;
        error_page 413 = @photo_too_large;
        proxy_pass http://data-service:3002;
        proxy_read_timeout 180s;
    }

    location ~ "^/api/photos/[1-9][0-9]{0,9}/original$" {
        limit_req zone=public_api burst=60 nodelay;
        proxy_pass http://data-service:3002;
    }

    location @photo_too_large {
        default_type application/json;
        return 413 '{"error":"O JPEG excede o limite de 10 MiB."}';
    }

    location / {
        return 404;
    }
}
