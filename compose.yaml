# Sistema do trabalho de Sistemas Distribuídos.
# Autenticação, InfluxDB e armazenamento de fotos local para desenvolvimento.

# Nome próprio do projeto, para não se misturar com outros projetos Docker do notebook.
name: sistemas-distribuidos

services:

  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?defina AUTH_DB_PASSWORD no arquivo .env}
      POSTGRES_DB: auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD:?defina AUTH_DB_PASSWORD no arquivo .env}@auth-db:5432/auth
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      FRONTEND_URL: http://localhost:8080
      JET_LOGGER_MODE: console
    depends_on:
      auth-db:
        condition: service_healthy

  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_LOCAL_ADMIN_PASSWORD:-}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_LOCAL_ADMIN_TOKEN:-}
      DOCKER_INFLUXDB_INIT_ORG: horticultura-local
      DOCKER_INFLUXDB_INIT_BUCKET: horticultura
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - ./influxdb/seed.sh:/docker-entrypoint-initdb.d/seed.sh:ro
      - ./influxdb/measurements.lp:/seed/measurements.lp:ro
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 5s
      timeout: 3s
      retries: 20

  influx-check:
    image: influxdb:2.7
    profiles: [tools]
    entrypoint: ["influx"]
    command: ["query", "--file", "/queries/latest.flux"]
    environment:
      INFLUX_HOST: ${INFLUX_HOST:-http://influxdb:8086}
      INFLUX_ORG: ${INFLUX_ORG:-horticultura-local}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-}
    volumes:
      - ./influxdb/latest.flux:/queries/latest.flux:ro

  influx-query:
    build:
      context: ./data-service
    profiles: [tools]
    environment:
      INFLUX_HOST: ${INFLUX_HOST:-http://influxdb:8086}
      INFLUX_ORG: ${INFLUX_ORG:-horticultura-local}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-}

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command:
      - mini
      - -dir=/data
      - -bucket=fotos
      - -s3.config=/etc/seaweedfs/s3.json
      - -webdav=false
      - -admin.ui=false
    volumes:
      - seaweedfs-data:/data
      - type: bind
        source: ./secrets/seaweedfs-s3.json
        target: /etc/seaweedfs/s3.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:alpine
    depends_on:
      - auth-service
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8080:80

volumes:
  auth-db-data:
  influxdb-data:
  influxdb-config:
  seaweedfs-data:
